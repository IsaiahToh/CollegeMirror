[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collegemirror-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "SimpleIDML>=0.92.0",
    "lxml>=5.3.0",
    "python-docx>=1.1.0",
    "mammoth>=1.8.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN101", "ANN102",  # removed rules
    "B008",              # FastAPI Depends() in defaults is idiomatic
    "E501",              # line length — formatter handles this
]

[tool.pyright]
pythonVersion = "3.12"
include = ["backend"]
strict = []
